name: temanhari
description: "TemanHari — AI Companion, Pengingat Harian Andal di Layar Mati, dan Integrasi Google Calendar & Microsoft Outlook."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigasi
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & SSE Streaming
  dio: ^5.8.0+1
  http: ^1.3.0

  # Penyimpanan Lokal Offline-First & Token Aman
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Notifikasi Lokal (Layar Mati) & Push FCM
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Suara Native (STT & TTS Bahasa Indonesia)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # OAuth 2.0 Deep Link Flow
  flutter_web_auth_2: ^4.1.0

  # Utilitas & UI
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
