name: Build Android APK (TemanHari)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL Backend API opsional (contoh: https://temanhari-api.up.railway.app)'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          if [ -n "${{ inputs.api_base_url }}" ]; then
            flutter build apk --release --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"
          else
            flutter build apk --release
          fi

      - name: Upload TemanHari APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TemanHari-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
